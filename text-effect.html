<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TLORA Studio | Luxury Editorial</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@300;400&display=swap"
        rel="stylesheet">

    <style>
        /* CSS RESET & CƠ BẢN */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body,
        html {
            width: 100%;
            height: 100%;
            background-color: #000000;
            overflow-x: hidden;
        }

        /* HERO SECTION 
      Background tối màu: đen → xám đậm.
      Có ambient light vàng champagne rất nhẹ ở giữa để tôn cụm chữ lên.
    */
        .hero {
            position: relative;
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #1a1712 0%, #0a0a0a 45%, #000000 100%);
            overflow: hidden;
        }

        /* TITLE: TLORA Studio
      Font: Cormorant Garamond - Thanh lịch, thời trang cao cấp.
    */
        .title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 8.5rem;
            font-weight: 500;
            margin-bottom: 1.5rem;
            text-align: center;
            line-height: 1.1;

            /* Sử dụng kỹ thuật Multi-background:
        - Layer 1 (trên cùng): Dải sáng nghiêng 45 độ, viền mềm (blur).
        - Layer 2 (dưới): Dải màu kim loại (Trắng -> Champagne -> Đồng nhẹ -> Trắng).
      */
            background-image:
                linear-gradient(45deg, transparent 40%, rgba(255, 255, 255, 0.75) 50%, transparent 60%),
                linear-gradient(to right, #ffffff 0%, #e6ce9e 35%, #c6a25e 65%, #ffffff 100%);

            background-size: 200% auto, 100% auto;
            background-position: -200% center, center center;

            /* Giới hạn background chỉ hiển thị trong chữ */
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;

            /* Gọi animation chạy dải sáng */
            animation: luxury-shine 6s ease-in-out infinite;
        }

        /* ANIMATION DẢI SÁNG (SHINE EFFECT)
      Tổng thời gian: 6s
      - 0% -> 40% (2.4s): Chạy từ trái sang phải
      - 40% -> 100% (3.6s): Dừng/Nghỉ
    */
        @keyframes luxury-shine {
            0% {
                background-position: -200% center, center center;
            }

            40% {
                background-position: 200% center, center center;
            }

            100% {
                background-position: 200% center, center center;
            }
        }

        /* SUBTITLE 
      Font: Montserrat - Chữ mảnh, spacing lớn tạo cảm giác xa xỉ.
    */
        .subtitle {
            font-family: 'Montserrat', sans-serif;
            font-size: 1rem;
            font-weight: 300;
            color: rgba(255, 255, 255, 0.6);
            /* Trắng mờ tinh tế */
            text-transform: uppercase;
            letter-spacing: 0.4em;
            /* Khoảng cách chữ lớn */
            margin-left: 0.4em;
            /* Bù trừ khoảng cách bị lệch do letter-spacing */
            text-align: center;
            animation: fade-in 2s ease-out forwards;
            opacity: 0;
        }

        @keyframes fade-in {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* RESPONSIVE DESIGN */

        /* Tablet */
        @media (max-width: 1024px) {
            .title {
                font-size: 6rem;
            }

            .subtitle {
                font-size: 0.85rem;
                letter-spacing: 0.35em;
                margin-left: 0.35em;
            }
        }

        /* Mobile */
        @media (max-width: 768px) {
            .title {
                font-size: 4rem;
                margin-bottom: 1rem;
            }

            .subtitle {
                font-size: 0.75rem;
                letter-spacing: 0.25em;
                margin-left: 0.25em;
            }
        }

        /* Small Mobile (iPhone SE, etc.) */
        @media (max-width: 480px) {
            .title {
                font-size: 3.2rem;
            }

            .subtitle {
                font-size: 0.65rem;
                letter-spacing: 0.2em;
                margin-left: 0.2em;
            }
        }
    </style>
</head>

<body>

    <section class="hero">
        <h1 class="title">TLORA Studio</h1>
        <p class="subtitle">Nơi cá tính trở thành nghệ thuật</p>
    </section>

    <script>
        // Có thể bổ sung JS cho các tương tác scroll hoặc cursor sau này
    </script>
</body>

</html>
